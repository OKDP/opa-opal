name: cd
on:
  push:
    branches: [master]
jobs:
  publish:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout Repo ⚡️
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.15.1
      
      - name: Login to quay.io
        run: helm registry login quay.io -u "${{ secrets.REGISTRY_USERNAME }}" -p "${{ secrets.REGISTRY_ROBOT_TOKEN }}"

      - name: Package helm charts
        run: helm package helm/opal-secrets

      - name: Publish charts
        run: helm push $(find . -type f -name "opal-secrets-*.tgz") oci://quay.io/okdp/charts
